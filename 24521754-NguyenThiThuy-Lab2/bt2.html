<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="button.css">
  <style>
    .container { margin: 20px; }
    .btn { margin: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn btn-green btn-medium btn-rectangle">Button</button>
    <button class="btn btn-blue btn-medium btn-rectangle">Button</button>
    <button class="btn btn-red btn-medium btn-rectangle">Button</button>
    <button class="btn btn-green btn-medium btn-rectangle">Button</button>
    <button class="btn btn-black btn-medium btn-rectangle">Button</button>
    
    <br><br>

    <button class="btn btn-green btn-medium btn-rounded">Button</button>
    <button class="btn btn-blue btn-medium btn-rounded">Button</button>
    <button class="btn btn-red btn-medium btn-rounded">Button</button>
    <button class="btn btn-green btn-medium btn-rounded">Button</button>
    <button class="btn btn-black btn-medium btn-rounded">Button</button>

    <br><br>

    <button class="btn btn-green btn-medium btn-oval">Button</button>
    <button class="btn btn-blue btn-medium btn-oval">Button</button>
    <button class="btn btn-red btn-medium btn-oval">Button</button>
    <button class="btn btn-green btn-medium btn-oval">Button</button>
    <button class="btn btn-black btn-medium btn-oval">Button</button>
  </div>

</body>
</html>
